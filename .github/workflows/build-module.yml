name: Compile OpenWrt 25.12 for IPQ60xx

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'OpenWrt base tag version'
        required: true
        default: '25.12.1'
      target:
        description: 'Target Architecture'
        required: true
        default: 'qualcommax'
      subtarget:
        description: 'Subtarget SoC platform'
        required: true
        default: 'ipq60xx'

env:
  KERNEL_VERSION: '6.18.38'
  KERNEL_HASH: '25da44f9c5d7963d33efc6b6531393bcff7012d9b23bfa1ffcdccba7ea6445aa'

jobs:
  build:
    name: Build OpenWrt (${{ github.event.inputs.target }}/${{ github.event.inputs.subtarget }})
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Free Disk Space & Install Build Prerequisites
        run: |
          sudo docker image prune -a -f
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gettext git libncurses5-dev libssl-dev python3-setuptools python3-dev file wget rsync unzip zlib1g-dev

      - name: Clone OpenWrt Source Repository
        env:
          REPO_URL: 'https://github.com'
        run: |
          git clone $REPO_URL -b v${{ github.event.inputs.version }} openwrt
          echo "WORK_DIR=$GITHUB_WORKSPACE/openwrt" >> $GITHUB_ENV

      - name: Update and Install Feeds
        run: |
          cd "${{ env.WORK_DIR }}"
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Inject Kernel 6.18.38 Version and Hash Overrides
        run: |
          cd "${{ env.WORK_DIR }}"
          
          # Force the system layout mapping to recognize kernel family 6.18
          sed -i "s/KERNEL_PATCHVER:=.*/KERNEL_PATCHVER:=6.18/" target/linux/${{ github.event.inputs.target }}/Makefile
          
          # Inject exact sub-version mapping metadata 
          echo "LINUX_VERSION-6.18 = .38" > include/kernel-6.18
          echo "LINUX_KERNEL_HASH-6.18.38 = ${{ env.KERNEL_HASH }}" >> include/kernel-6.18

      - name: Generate Defconfig File
        run: |
          cd "${{ env.WORK_DIR }}"
          
          # Enforce hardware compilation flags
          echo "CONFIG_TARGET_${{ github.event.inputs.target }}=y" > .config
          echo "CONFIG_TARGET_${{ github.event.inputs.target }}_${{ github.event.inputs.subtarget }}=y" >> .config
          
          # Automatically select dependent packages and configurations
          FORCE=1 make defconfig

      - name: Pre-download Source Code Dependencies
        run: |
          cd "${{ env.WORK_DIR }}"
          FORCE=1 make download -j$(nproc)
          find dl -size -1024c -exec ls -l {} \;
          find dl -size -1024c -exec rm -f {} \;

      - name: Multi-Threaded Firmware Compilation
        run: |
          cd "${{ env.WORK_DIR }}"
          echo "Compiling using $(nproc) execution threads..."
          FORCE=1 make -j$(nproc) || FORCE=1 make -j1 V=s

      - name: Upload Finished Firmware Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-${{ github.event.inputs.target }}-${{ github.event.inputs.subtarget }}-firmware
          path: ${{ env.WORK_DIR }}/bin/targets/${{ github.event.inputs.target }}/${{ github.event.inputs.subtarget }}/*
